<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MERCY ARM CONSOLE</title>

  <style>
    :root {
      --gold: #C8A24A;
      --navy: #0F1B2D;
      --green: #2E7D5B;
      --red: #B3261E;
      --gray: #F4F4F4;
      --text: #2B2B2B;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--gray);
      font-family: Arial, sans-serif;
      color: var(--text);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 25px;
      text-align: center;
      border-bottom: 4px solid var(--gold);
    }

    nav {
      background: var(--gold);
      padding: 12px;
      text-align: center;
    }

    nav a {
      color: var(--navy);
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-left: 5px solid var(--gold);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      color: var(--navy);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      background: var(--navy);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    pre {
      background: #111;
      color: #00ff88;
      padding: 15px;
      overflow-x: auto;
      border-radius: 6px;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>MERCY ARM CONSOLE</h1>
  <p>Founder Steward Input Layer</p>
</header>

<nav>
  <a href="index.html">Dashboard</a>
  <a href="ledger.html">Ledger</a>
  <a href="charter.html">Charter</a>
  <a href="console.html">Console</a>
</nav>

<div class="container">

  <div class="card">

    <h2>Create Mercy Record</h2>

    <label>Date</label>
    <input type="date" id="date">

    <label>Recipient</label>
    <input type="text" id="recipient">

    <label>Category</label>
    <select id="category">
      <option value="MED">MED</option>
      <option value="EDU">EDU</option>
      <option value="SHE">SHE</option>
      <option value="FOO">FOO</option>
      <option value="EMR">EMR</option>
    </select>

    <label>Amount</label>
    <input type="number" id="amount">

    <label>Purpose</label>
    <textarea id="purpose"></textarea>

    <button onclick="generateRecord()">
      Generate Ledger Entry
    </button>

    <pre id="output">
Your generated JSON entry will appear here.
    </pre>

  </div>

</div>

<footer>
  Mercy ARM Console • Stewardship Authority Required
</footer>

<script>

function generateRecord() {

  const record = {

    date:
      document.getElementById("date").value,

    recipient:
      document.getElementById("recipient").value,

    category:
      document.getElementById("category").value,

    amount:
      Number(document.getElementById("amount").value),

    purpose:
      document.getElementById("purpose").value

  };

  document.getElementById("output").innerText =
    JSON.stringify(record, null, 2);
}

</script>

</body>
</html>
