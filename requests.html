<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MERCY REQUESTS QUEUE</title>

  <style>
    :root {
      --gold: #C8A24A;
      --navy: #0F1B2D;
      --green: #2E7D5B;
      --red: #B3261E;
      --gray: #F4F4F4;
      --text: #2B2B2B;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--gray);
      color: var(--text);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 25px;
      text-align: center;
      border-bottom: 4px solid var(--gold);
    }

    nav {
      background: var(--gold);
      padding: 12px;
      text-align: center;
    }

    nav a {
      color: var(--navy);
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-left: 5px solid var(--gold);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      color: var(--navy);
    }

    select {
      padding: 10px;
      margin-bottom: 15px;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .request {
      border-bottom: 1px solid #eee;
      padding: 15px 0;
    }

    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: white;
      margin-bottom: 5px;
    }

    .MED { background: #B3261E; }
    .EDU { background: #2E7D5B; }
    .SHE { background: #C8A24A; color: #111; }
    .FOO { background: #0F1B2D; }
    .EMR { background: #7A1FA2; }

    .meta {
      font-size: 13px;
      color: #555;
      margin-top: 5px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }

  </style>
</head>

<body>

<header>
  <h1>MERCY REQUEST QUEUE</h1>
  <p>Operational Intake Review System</p>
</header>

<nav>
  <a href="index.html">Dashboard</a>
  <a href="vault.html">Vault</a>
  <a href="signals.html">Signals</a>
  <a href="ledger.html">Ledger</a>
  <a href="charter.html">Charter</a>
  <a href="request.html">Submit Request</a>
  <a href="requests.html">Queue</a>
</nav>

<div class="container">

  <div class="card">

    <h2>Filter Requests</h2>

    <select id="filter" onchange="renderRequests()">
      <option value="ALL">All Requests</option>
      <option value="MED">Medical</option>
      <option value="EDU">Education</option>
      <option value="SHE">Shelter</option>
      <option value="FOO">Food</option>
      <option value="EMR">Emergency</option>
    </select>

    <div id="list"></div>

  </div>

</div>

<script>

let requests = [];

async function loadRequests() {

  try {

    requests =
      await fetch("requests.json")
      .then(r => r.json());

  } catch (e) {

    requests = [];
  }

  renderRequests();
}

function renderRequests() {

  const filter =
    document.getElementById("filter").value;

  const list =
    document.getElementById("list");

  list.innerHTML = "";

  let filtered =
    filter === "ALL"
      ? requests
      : requests.filter(r => r.category === filter);

  if (filtered.length === 0) {
    list.innerHTML =
      "<div class='empty'>No requests found.</div>";
    return;
  }

  filtered.forEach(r => {

    const div =
      document.createElement("div");

    div.className = "request";

    div.innerHTML = `
      <span class="tag ${r.category}">
        ${r.category}
      </span>

      <div><strong>${r.name}</strong></div>

      <div class="meta">
        ${r.location} • ${r.date}
      </div>

      <div class="meta">
        ${r.description}
      </div>

      <div class="meta">
        Status: ${r.status}
      </div>
    `;

    list.appendChild(div);
  });
}

loadRequests();

</script>

</body>
</html>
