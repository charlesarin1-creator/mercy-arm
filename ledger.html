<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MERCY ARM LEDGER</title>

  <style>
    :root {
      --gold: #C8A24A;
      --navy: #0F1B2D;
      --green: #2E7D5B;
      --red: #B3261E;
      --gray: #F4F4F4;
      --text: #2B2B2B;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--gray);
      font-family: Arial, sans-serif;
      color: var(--text);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 25px;
      text-align: center;
      border-bottom: 4px solid var(--gold);
    }

    nav {
      background: var(--gold);
      padding: 12px;
      text-align: center;
    }

    nav a {
      color: var(--navy);
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-left: 5px solid var(--gold);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      color: var(--navy);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      margin-bottom: 20px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: var(--navy);
      color: white;
      padding: 10px;
      text-align: left;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .tag {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      color: white;
    }

    .MED {
      background: #B3261E;
    }

    .EDU {
      background: #2E7D5B;
    }

    .SHE {
      background: #C8A24A;
      color: #111;
    }

    .FOO {
      background: #0F1B2D;
    }

    .EMR {
      background: #7A1FA2;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 768px) {

      table,
      thead,
      tbody,
      th,
      td,
      tr {
        display: block;
      }

      th {
        display: none;
      }

      td {
        border: none;
        padding: 10px 0;
      }

      td::before {
        font-weight: bold;
        display: block;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>MERCY ARM LEDGER</h1>
  <p>Institutional Memory • Mercy Record System</p>
</header>

<nav>
  <a href="index.html">Dashboard</a>
  <a href="charter.html">Charter</a>
  <a href="ledger.html">Ledger</a>
</nav>

<div class="container">

  <div class="card">

    <h2>Mercy Ledger Records</h2>

    <input
      type="text"
      id="searchInput"
      placeholder="Search recipient or category..."
    />

    <table>

      <thead>
        <tr>
          <th>Date</th>
          <th>Recipient</th>
          <th>Category</th>
          <th>Amount</th>
        </tr>
      </thead>

      <tbody id="ledgerBody"></tbody>

    </table>

  </div>

</div>

<footer>
  Mercy ARM Ledger • Stewardship Memory Active
</footer>

<script>

async function loadLedger() {

  const ledger =
    await fetch('ledger.json').then(r => r.json());

  const body =
    document.getElementById("ledgerBody");

  function renderTable(data) {

    body.innerHTML = "";

    data.forEach(item => {

      const row =
        document.createElement("tr");

      row.innerHTML = `
        <td>${item.date}</td>

        <td>${item.recipient}</td>

        <td>
          <span class="tag ${item.category}">
            ${item.category}
          </span>
        </td>

        <td>₦${item.amount}</td>
      `;

      body.appendChild(row);
    });
  }

  renderTable(ledger);

  // SEARCH SYSTEM
  document
    .getElementById("searchInput")
    .addEventListener("keyup", function () {

      const value =
        this.value.toLowerCase();

      const filtered =
        ledger.filter(item =>

          item.recipient.toLowerCase().includes(value)
          ||
          item.category.toLowerCase().includes(value)

        );

      renderTable(filtered);

    });

}

loadLedger();

</script>

</body>
</html>
